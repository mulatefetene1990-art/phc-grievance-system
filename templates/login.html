<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PHC Portal Authorization</title>
    <link rel="stylesheet" href="https://jsdelivr.net">
</head>
<body>
    <main style="max-width: 450px; margin: 60px auto;">
        <h2>🏥 Primary Health Care Core Network</h2>
        <h3>Grievance Management Portal Login</h3>
        
        {% with messages = get_flashed_messages() %}
            {% if messages %}<div style="color: #ff5252; margin-bottom: 15px; font-weight: bold;">⚠️ {{ messages[0] }}</div>{% endif %}
        {% endwith %}

        <form method="POST">
            <label for="username">System Identification User ID</label>
            <input type="text" id="username" name="username" placeholder="patient01 or admin01" required>
            
            <label for="password">Security Password Matrix</label>
            <input type="password" id="password" name="password" placeholder="••••••••" required>
            
            <button type="submit" style="width: 100%;">Authenticate and Access System</button>
        </form>
    </main>
</body>
</html>
